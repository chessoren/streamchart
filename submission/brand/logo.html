<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(inter.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
body{background:radial-gradient(700px 600px at 30% 20%,#ffffff 0%,#eef3fb 55%,#e2eaf6 100%);display:grid;place-items:center;font-family:Inter}
.ring{width:720px;height:720px;border-radius:50%;background:conic-gradient(from 210deg,#3b6ef6,#8fb0ff,#f0556b,#3b6ef6);display:grid;place-items:center;box-shadow:0 40px 90px rgba(40,70,140,.25)}
.inner{width:650px;height:650px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#f3f7ff 70%,#e9f0ff);display:grid;place-items:center;box-shadow:inset 0 2px 0 #fff, inset 0 -10px 30px rgba(59,110,246,.08)}
</style></head><body>
<div class="ring"><div class="inner">
<svg width="520" height="330" viewBox="0 0 100 62" fill="none">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1d3fa8"/><stop offset=".45" stop-color="#3b6ef6"/><stop offset="1" stop-color="#5b9cff"/></linearGradient></defs>
<path d="M4 34 H14 L19 22 L25 46 L31 12 L37 40 L41 30 C47 30 49 22 56 22 C64 22 64 42 72 42 C80 42 80 26 88 26 C93 26 95 30 96 32" stroke="url(#g)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div></div>
</body></html>
